<style>
:root{--sun:#FBD34D;--sun-deep:#F4B81E;--ink:#1E1D1D;--ink-2:#4A4844;--ink-3:#807C74;--marker:#ED2A1A;--paper:#FBFAF7;--paper-2:#F4F1EA;--hairline:#EBE6DB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Spectral',serif;font-size:18px;line-height:1.6}
a{color:var(--ink)}a:hover{color:var(--sun-deep)}
:focus-visible{outline:3px solid var(--sun-deep);outline-offset:4px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--sun);color:var(--ink);padding:10px 16px;z-index:30;font-family:'Space Grotesk',sans-serif;text-decoration:none}
.skip:focus{left:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--hairline);background:var(--paper)}
.nav-in{display:flex;align-items:center;justify-content:space-between;min-height:72px}
.marke{font-weight:600;font-size:19px;text-decoration:none;color:var(--ink)}
.nav-links{display:flex;gap:26px;font-family:'Space Grotesk',sans-serif;font-size:14px}
.nav-links a{text-decoration:none;color:var(--ink-2)}
.nav-links a:hover{color:var(--ink)}
.held{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:40px;align-items:center;min-height:calc(100svh - 73px);padding-bottom:40px}
.held h1{font-weight:500;font-size:clamp(46px,6vw,80px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.held h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 96%,transparent 96%);padding:0 4px}
.held .lead{margin:24px 0 0;max-width:44ch;font-size:21px;font-style:italic;color:var(--ink-2);text-wrap:pretty}
.hinweis{margin:36px 0 0;font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.netz{width:100%;height:auto}
.netz .kante{stroke:rgba(30,29,29,.22);stroke-width:1.5}
.netz .stern{fill:rgba(30,29,29,.35)}
.knoten{cursor:pointer}
.knoten circle.kern{fill:var(--sun);stroke:var(--ink);stroke-width:4;transition:fill .18s ease}
.knoten:hover circle.kern{fill:var(--sun-deep)}
.knoten text{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;fill:var(--ink)}
.knoten .sub{font-size:23px;letter-spacing:.06em;text-transform:none;fill:var(--ink-3)}
.schwebt-a{animation:schweben 7s ease-in-out infinite}
.schwebt-b{animation:schweben 9s ease-in-out infinite reverse}
@keyframes schweben{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fuss{border-top:1px solid var(--hairline);background:var(--paper-2)}
.fuss-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 0;font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink-3)}
.fuss a{color:var(--ink-3);text-decoration:none;margin-left:18px}
.fuss a:hover{color:var(--ink)}
@media (max-width:900px){.held{grid-template-columns:1fr;min-height:0;padding:48px 0}.netz{max-width:560px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.schwebt-a,.schwebt-b{animation:none}.knoten circle.kern{transition:none}}
</style>
