<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" role="img" aria-label="Herausforderungen – animiertes böses Grinsen (5s Loop)">
  
  <defs>
    <style>
      /* 5s-Loop, dezent. Läuft auch bei &lt;img&gt;-Einbettung (CSS-Animation im SVG). */
      #wobble { transform-box: fill-box; transform-origin: center; animation: wobble 5s ease-in-out infinite; }
      #wash   { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
      #pfeile { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
      @keyframes wobble {
        0%, 100% { transform: rotate(-2deg); }
        50%      { transform: rotate(2deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1);    opacity: .88; }
        50%      { transform: scale(1.05); opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .55; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #wobble, #wash, #pfeile { animation: none; }
      }
    </style>
  </defs>

  <g id="alles">
    <g id="wash" fill="#FBD34D" stroke="none">
      <path id="wash-p" d="M 170 220 c -22 30 -28 76 -6 104 c 28 36 104 44 162 32 c 54 -12 92 -42 92 -80 c 0 -40 -40 -72 -78 -86 c -38 -14 -90 -12 -122 4 c -22 11 -38 16 -48 26 z"></path>
    </g>

    <g id="wobble">
      <g id="grinsen" fill="none" stroke="#ED2A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path id="auge-l" d="M 218 178 c 4 -16 24 -20 34 -8 c 8 10 2 24 -12 26 c -12 2 -22 -6 -22 -18 z"></path>
        <path id="auge-r" d="M 296 170 c 4 -15 23 -19 33 -8 c 8 10 2 23 -11 25 c -12 2 -22 -6 -22 -17 z"></path>
        <g id="mund-gruppe" transform="rotate(180 269 274)">
          <path id="mund" pathLength="1" d="M 158 218 c -2 44 16 84 52 104 c 40 22 96 20 132 -8 c 28 -22 40 -56 38 -92 c -8 26 -26 44 -54 56 c -36 15 -84 15 -118 -2 c -26 -13 -42 -32 -50 -58 z"></path>
          <path id="zaehne" stroke-width="6" d="M 214 268 l 4 30 M 254 282 l 2 30 M 296 283 l -2 30 M 336 268 l -6 28"></path>
        </g>
      </g>
    </g>

    <g id="pfeile" fill="none" stroke="#1E1D1D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path id="pfeil-l" d="M 196 108 c -28 -8 -54 -8 -78 2 M 132 96 l -16 14 l 20 8"></path>
      <path id="pfeil-r" d="M 336 100 c 30 -10 58 -10 84 0 M 404 88 l 18 12 l -20 10"></path>
      <path id="pfeil-u-l" d="M 172 352 c -20 14 -34 32 -40 52 M 124 388 l 6 20 l 18 -12"></path>
      <path id="pfeil-u-r" d="M 366 348 c 22 14 36 32 42 52 M 398 392 l 12 16 l 8 -20"></path>
    </g>

    <g id="akzente" fill="none" stroke="#1E1D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path id="knaeuel" d="M 96 240 c 14 -12 28 -10 30 2 c 2 12 -14 18 -22 10 c -8 -8 2 -22 16 -20 c 10 1 16 8 14 16"></path>
      <path id="ausruf-1" stroke-width="7" d="M 448 210 c -2 14 -4 24 -8 36 M 434 274 l 0 2"></path>
      <path id="ausruf-2" d="M 470 258 c -2 10 -4 18 -7 27 M 460 306 l 0 2"></path>
      <path d="M 84 160 l 8 14 M 100 158 l -6 16 M 78 178 l 18 -6"></path>
    </g>
    <g id="punkte" fill="#1E1D1D" stroke="none">
      <circle cx="140" cy="300" r="4"></circle>
      <circle cx="420" cy="140" r="4"></circle>
      <circle cx="446" cy="352" r="4"></circle>
      <circle cx="104" cy="120" r="4"></circle>
      <circle cx="264" cy="80" r="4"></circle>
      <circle cx="296" cy="368" r="4"></circle>
    </g>
  </g>
</svg>